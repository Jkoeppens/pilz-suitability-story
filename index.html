<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Ich sage Pilze voraus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Schrift: IBM Plex Sans -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Hauptstyles -->
  <link rel="stylesheet" href="style.css?v=12">
  <!-- Markdown-Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MapLibre GL JS -->
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.1.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@6.1.0/dist/maplibre-gl.js"></script>

  <!-- MapTiler API-Key — hier eintragen -->
  <script>window.MAPTILER_KEY = 'G5GPJB5Uc1WS11NDAPWV';</script>


</head>

<body>

  <div class="overlay-model hidden">
    <div class="overlay-model-inner">
      <iframe
        src="viz/index.html"
        class="model-frame"
        loading="lazy">
      </iframe>
    </div>
  </div>

<div id="app">

  <!-- Fixed MapLibre map — immer im Hintergrund -->
  <div id="map"></div>

  <!-- 2×2 Raster-Quad-Karte für Stage 4 -->
  <div id="quad-root" class="hidden">
    <div id="quad-tl" class="quad-cell"></div><!-- oben links:  Local Moran -->
    <div id="quad-tr" class="quad-cell"></div><!-- oben rechts: Local Geary -->
    <div id="quad-bl" class="quad-cell"></div><!-- unten links: NDWI        -->
    <div id="quad-br" class="quad-cell"></div><!-- unten rechts: NDVI       -->

    <!-- Eck-Legenden -->
    <div class="quad-label tl">
      <span class="ql-title">Local Moran</span>
      <div class="ql-bar ql-bar--moran"></div>
      <span class="ql-sub" data-i18n="legend_moran_sub">lokale Clusterung</span>
    </div>
    <div class="quad-label tr">
      <span class="ql-title">Local Geary</span>
      <div class="ql-bar ql-bar--geary"></div>
      <span class="ql-sub" data-i18n="legend_geary_sub">lokaler Kontrast</span>
    </div>
    <div class="quad-label bl">
      <span class="ql-title">NDWI</span>
      <div class="ql-bar ql-bar--ndwi"></div>
      <span class="ql-sub" data-i18n="legend_ndwi_sub">Feuchte</span>
    </div>
    <div class="quad-label br">
      <span class="ql-title">NDVI</span>
      <div class="ql-bar ql-bar--ndvi"></div>
      <span class="ql-sub" data-i18n="legend_ndvi_sub">Vegetation</span>
    </div>
  </div>

  <!-- ======================================
       STAGE 1: Wald + Pilz (PNG-Überblendung)
       Liegt über der Karte, blendet beim
       Übergang zu Stage 2 aus.
  ======================================= -->
  <div id="media-root">
    <div class="media-group" data-stage="1">
      <img src="img/Wald.png" class="bg-img" alt="">
      <img src="img/Pilz.png" class="overlay-img overlay-pilz" alt="">
    </div>
  </div>


<!-- Fullscreen interaktive Eignungskarte (letzter Stage) -->
<div id="prediction-map" class="hidden">
  <button id="map-exit-btn" data-i18n="map_back">← Zurück</button>
  <div id="suit-map-legend">
    <div class="legend-gradient"></div>
    <div class="legend-labels">
      <span>0</span>
      <span data-i18n="map_suitability_title">Eignung für Parasole</span>
      <span>1</span>
    </div>
  </div>
  <div id="suit-map-inner"></div>
</div>

<!-- Legende für Eignungskarte — erscheint wenn prediction-map aktiv -->
<div id="suit-legend" class="map-legend hidden">
  <div class="legend-gradient"></div>
  <div class="legend-labels">
    <span>0</span>
    <span data-i18n="map_suitability_title">Eignung für Parasole</span>
    <span>1</span>
  </div>
</div>

  <!-- ======================================
       INTRO (NICHT SCROLL-STORY)
  ======================================= -->
  <section id="intro">
    <article class="intro-block">
      <div id="intro-md" data-md="slide1_01_intro.md"></div>
    </article>
  </section>


  <!-- ======================================
       SCROLL-STORY REGION
  ======================================= -->
  <main id="scroll-root">

    <!-- Intro Anchor -->
    <article class="step step--invisible"
             data-stage="1"
             data-intro-step="true">
    </article>

    <!-- ======= STAGE 1 ======= -->
    <article class="step step--invisible"
             data-stage="1"
             data-overlay="overlay-pilz">
    </article>

    <article class="step"
             data-stage="1"
             data-md="slide1_02_body.md">
    </article>

    <article class="step step--invisible"
             data-stage="1"
             style="height: 100vh;">
    </article>


    <!-- ======= STAGE 2 ======= -->
    <article class="step step--invisible"
             data-stage="2"
             data-overlay="overlay-parasole">
    </article>

    <article class="step"
             data-stage="2"
             data-md="slide2_01_intro.md">
    </article>

    <article class="step"
             data-stage="2"
             data-md="slide2_02_parasol.md">
    </article>


    <!-- ======= STAGE 3 ======= -->
    <article class="step step--invisible"
             data-stage="3"
             data-overlay="overlay-parasol2">
    </article>

    <article class="step"
             data-stage="3"
             data-md="slide3_01_intro.md">
    </article>

    <article class="step step--invisible"
             data-stage="3"
             data-overlay="overlay-meisen">
    </article>

    <article class="step"
             data-stage="3"
             data-md="slide3_03_meisen.md">
    </article>
    
    <!-- ======= STAGE 4 ======= -->

    <article class="step"
             data-stage="4"
             data-overlay="overlay-fundpunkte-berlin_stg4"
             data-md="slide04_01_bias_text.md">
    </article>

    <article class="step"
            data-stage="4"
            data-md="slide4_02_signatures.md">
    </article>

    <!-- ======= STAGE 5 ======= -->

    <article class="step"
            data-stage="5"
            data-md="slide5_02_signatures_Data.md">
    </article>

    <article class="step"
            data-stage="5"
            data-overlay="overlay-fundpunkte-berlin"
            data-md="slide5_03_model_intro.md">
    </article>

    <article class="step"
            data-stage="5"
            data-overlay="overlay-fundpunkte-berlin"
            data-model="true"
            data-md="slide5_04_charts.md">
    </article>

    <article class="step"
            data-stage="5"
            data-model="true"
            data-md="slide5_05_prediction_intro.md">
    </article>

    <article class="step"
            data-stage="5"
            data-model="true"
            data-md="slide5_06_prediction_explain.md">
    </article>
    <article class="step step--spacer"
            data-stage="5"
            data-trigger="prediction-map">
    </article>

  </main>

</div> <!-- END app -->

<!-- Points drawn here: z-index 5 → above quad (inside #map z-index 0), below text boxes (#scroll-root z-index 10) -->
<canvas id="points-canvas" style="position:fixed;inset:0;z-index:5;pointer-events:none;display:none;"></canvas>

<script src="main.js"></script>

<!-- Fixed Footer -->
<div style="position:fixed;bottom:12px;right:12px;z-index:2001;font-size:11px;background:rgba(0,0,0,0.55);color:#fff;padding:4px 8px;border-radius:4px;pointer-events:auto;">
  Jakob Koppermann · jakob.koppermann@gmail.com · Datenpipeline:
  <a href="https://github.com/Jkoeppens/inat_habitat_modeling"
     target="_blank"
     rel="noopener"
     style="color:#fff;text-decoration:underline;">github.com/Jkoeppens/inat_habitat_modeling</a>
</div>

</body>

<!-- Language Switch (fixed top-right) -->
<div id="lang-switch" class="lang-switch" aria-label="Language switch">
  <button type="button" class="lang-btn" data-lang="de">DE</button>
  <span class="lang-sep">/</span>
  <button type="button" class="lang-btn" data-lang="en">EN</button>
</div>

</html>
