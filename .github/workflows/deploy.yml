name: Deploy to GitHub Pages

# Vorerst nur vom svelte-migration-Branch, nicht main — main bleibt
# unangetastet, bis das Ergebnis geprüft ist.
on:
  push:
    branches:
      - svelte-migration

permissions:
  contents: read
  pages: write
  id-token: write

# Nur einen Deploy gleichzeitig, keinen laufenden Deploy abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
